# Reprocessa os .xlsx do repositório de dados e publica o app no GitHub Pages.
#
# Dispara em:
#  - push neste repositório (mudanças no app);
#  - agendamento DIÁRIO às 09:00 UTC / 06:00 de Brasília. É esta linha que faz
#    o app reler o Historico_emendas_apresentadas.xlsx todo dia: o passo de
#    processamento baixa o arquivo de novo e regenera o public/dados.json do
#    zero, então uma aba de ano nova ou linhas novas entram sozinhas, sem
#    tocar no código. Só é preciso republicar o app quando o CÓDIGO muda.
#    ATENÇÃO: o GitHub SUSPENDE agendamentos em repositório sem atividade por
#    60 dias — ele avisa por e-mail e basta reativar em Actions, ou rodar o
#    workflow manualmente uma vez para zerar a contagem.
#  - manualmente (aba Actions -> Run workflow), para não esperar o horário;
#  - repository_dispatch tipo "dados-atualizados" (opcional: dispare a partir
#    do repositório de dados — ver INSTRUCOES_DEPLOY.md, seção 5).
name: Build e deploy no GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # 06:00 América/São Paulo
  workflow_dispatch:
  repository_dispatch:
    types: [dados-atualizados]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Processar .xlsx do repositório de dados
        env:
          # Autentica as chamadas à API do GitHub (limite 5.000/h em vez de 60/h),
          # evitando o erro "rate limit exceeded" ao listar os .xlsx.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install openpyxl
          python3 scripts/processar_dados.py   # baixa os .xlsx via API do GitHub

      - name: Build do front-end
        run: |
          npm ci
          # Versiona o cache do service worker a cada deploy: o nome do cache
          # passa a conter o SHA do commit, então um deploy novo invalida o
          # anterior inteiro e ninguém fica com o bundle velho.
          #
          # O padrão casa QUALQUER valor de VERSAO — a versão anterior deste
          # passo procurava a string literal 'emendas-md-v1' e, quando o nome
          # mudou, o sed deixou de casar SEM ERRO, congelando o nome do cache.
          # Por isso o `grep -q` logo abaixo: se um dia o formato da linha
          # mudar, o build FALHA em vez de publicar um cache que nunca vira.
          sed -i -E "s/^const VERSAO = '.*'/const VERSAO = 'analise-ploa-${GITHUB_SHA::8}'/" public/sw.js
          grep -q "const VERSAO = 'analise-ploa-${GITHUB_SHA::8}'" public/sw.js \
            || { echo "ERRO: não foi possível versionar o cache em public/sw.js"; exit 1; }
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
